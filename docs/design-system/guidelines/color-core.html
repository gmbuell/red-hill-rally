<!-- @dsCard group="Colors" viewport="700x150" name="Core palette" subtitle="Three colors only: black, white, Red Hill Red" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}*{box-sizing:border-box}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px">
<div><div style="height:64px;background:var(--black)"></div><div class="label" style="margin-top:6px">Black</div><div style="font-size:13px;color:var(--text-muted)">#000000</div></div>
<div><div style="height:64px;background:var(--white);border:1px solid #ddd"></div><div class="label" style="margin-top:6px">White</div><div style="font-size:13px;color:var(--text-muted)">#FFFFFF</div></div>
<div><div style="height:64px;background:var(--paper);border:1px solid #ddd"></div><div class="label" style="margin-top:6px">Paper</div><div style="font-size:13px;color:var(--text-muted)">#F4F2ED</div></div>
<div><div style="height:64px;background:var(--red)"></div><div class="label" style="margin-top:6px">Red Hill Red</div><div style="font-size:13px;color:var(--text-muted)">#E31E24</div></div>
</div></body></html>
