<!-- @dsCard group="Colors" viewport="700x150" name="Semantic aliases" subtitle="Surfaces invert; red stays an accent" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}*{box-sizing:border-box}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
<div style="background:var(--surface-panel);border:var(--border);padding:14px"><div class="display" style="font-size:22px">Panel.</div><div class="label" style="color:var(--text-muted);margin-top:4px">--surface-panel</div></div>
<div style="background:var(--surface-inverse);padding:14px"><div class="display" style="font-size:22px;color:var(--text-inverse)">Inverse.</div><div class="label" style="color:var(--text-muted-inverse);margin-top:4px">--surface-inverse</div></div>
<div style="background:var(--surface-inverse);padding:14px"><div class="display" style="font-size:22px;color:var(--accent)">Accent.</div><div class="label" style="color:var(--text-muted-inverse);margin-top:4px">--accent on inverse</div></div>
</div></body></html>
